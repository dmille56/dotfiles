backend = "glx";
vsync = true;
use-damage = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -8;
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 10;

# Window open/close and geometry animations.
animations = ({
  triggers = [ "open", "show" ];
  opacity = {
    curve = "linear";
    duration = 0.15;
    start = "window-raw-opacity-before";
    end = "window-raw-opacity";
  };
  scale-x = {
    curve = "cubic-bezier(0.24, 0.64, 0.79, 0.98)";
    duration = 0.15;
    start = 0.96;
    end = 1;
  };
  scale-y = "scale-x";
}, {
  triggers = [ "close", "hide" ];
  opacity = {
    curve = "linear";
    duration = 0.15;
    start = "window-raw-opacity-before";
    end = 0;
  };
  scale-x = {
    curve = "cubic-bezier(0.21, 0.02, 0.76, 0.36)";
    duration = 0.15;
    start = 1;
    end = 0.92;
  };
  scale-y = "scale-x";
}, {
  triggers = [ "geometry" ];
  preset = "geometry-change";
}, {

# XMonad publishes EWMH desktop changes, which this fork uses for workspace animations.
  triggers = [ "workspace-out" ];
  offset-x = {
    curve = "cubic-bezier(0.21, 0.02, 0.76, 0.36)";
    duration = 0.15;
    start = 0;
    end = "-window-width / 2";
  };
  opacity = {
    curve = "linear";
    duration = 0.15;
    start = "window-raw-opacity-before";
    end = "window-raw-opacity";
  };
}, {
  triggers = [ "workspace-in" ];
  offset-x = {
    curve = "cubic-bezier(0.24, 0.64, 0.79, 0.98)";
    duration = 0.15;
    start = "window-width / 2";
    end = 0;
  };
  opacity = {
    curve = "linear";
    duration = 0.15;
    start = 0;
    end = "window-raw-opacity";
  };
});

rules = ({
  match = "window_type = 'dock' || window_type = 'desktop'";
  shadow = false;
  animations = ();
}, {
  match = "class_g = 'Xfce4-notifyd'";
  shadow = false;
  animations = ();
}, {
  match = "_NET_WM_STATE *= '_NET_WM_STATE_FULLSCREEN'";
  shadow = false;
  animations = ();
});
